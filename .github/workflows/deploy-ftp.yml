name: Deploy to PAICE.work

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string
      expected-source-revision:
        required: true
        type: string
      expected-reviewed-input-sha256:
        required: true
        type: string
      expected-artifact-sha256:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout verifier
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download reviewed publication artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: publication

      - name: Verify downloaded publication artifact
        env:
          EXPECTED_SOURCE_REVISION: ${{ inputs.expected-source-revision }}
          EXPECTED_REVIEWED_INPUT_SHA256: ${{ inputs.expected-reviewed-input-sha256 }}
          EXPECTED_ARTIFACT_SHA256: ${{ inputs.expected-artifact-sha256 }}
        run: |
          node scripts/verify-publication-manifest.js publication \
            --expected-source-revision "$EXPECTED_SOURCE_REVISION" \
            --expected-reviewed-input-sha256 "$EXPECTED_REVIEWED_INPUT_SHA256" \
            --expected-artifact-sha256 "$EXPECTED_ARTIFACT_SHA256"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./publication/
          server-dir: /
