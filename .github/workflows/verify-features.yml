name: Verify Features

on:
  # Twice weekly - Monday and Thursday at 6pm Pacific (Tue/Fri 01:00 UTC)
  schedule:
    - cron: '0 1 * * 2,5'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to verify (leave empty for all)'
        required: false
        type: string
      stale_only:
        description: 'Only verify stale features'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (no issues or source updates)'
        required: false
        type: boolean
        default: false
      max_features:
        description: 'Maximum features to verify'
        required: false
        type: number
        default: 50

jobs:
  verify:
    name: Verify Feature Data
    runs-on: ubuntu-latest
    concurrency:
      group: verify-features-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # This conservative envelope exists before the verifier, build, or any
      # source mutation. Later steps preserve these raw files rather than
      # reconstructing a successful-looking report after a partial failure.
      - name: Initialize verification evidence
        id: initialize
        run: |
          set -euo pipefail
          mkdir -p .verification-reports
          cat > .verification-reports/health.json <<'EOF'
          {"status":"failed","counts":{},"providers":{},"reasons":["cli_not_started"]}
          EOF
          cat > .verification-reports/results.json <<'EOF'
          []
          EOF
          cat > .verification-reports/summary.txt <<'EOF'
          status: failed
          reason: cli_not_started
          direct notification: not_configured
          human receipt: unconfirmed
          missing-run monitor: not_configured
          EOF
          cat > .verification-reports/report.md <<'EOF'
          # Verification report

          Status: failed

          The verification CLI did not start. Treat coverage as unknown until
          retained evidence and the workflow failure are reviewed.
          EOF
          cat > .verification-reports/alert.json <<'EOF'
          {"type":"verification_run_failed","severity":"critical","notification":{"directNotification":"not_configured","humanReceipt":"unconfirmed","missingRunMonitor":"not_configured"},"evidence":{"reason":"cli_not_started"}}
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build verification arguments
        id: args
        env:
          PLATFORM_INPUT: ${{ inputs.platform }}
          STALE_ONLY_INPUT: ${{ inputs.stale_only }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          MAX_FEATURES_INPUT: ${{ inputs.max_features }}
        run: |
          set -uo pipefail
          exit_code=0
          dry_run=false

          if [ -n "${PLATFORM_INPUT:-}" ]; then
            case "$PLATFORM_INPUT" in
              *[!A-Za-z0-9._-]*) echo "::error::Invalid platform input."; exit_code=2 ;;
              *) ;;
            esac
          fi

          case "${STALE_ONLY_INPUT:-false}" in
            ''|false) ;;
            true) ;;
            *) echo "::error::Invalid stale_only input."; exit_code=2 ;;
          esac
          case "${DRY_RUN_INPUT:-false}" in
            ''|false) ;;
            true) dry_run=true ;;
            *) echo "::error::Invalid dry_run input."; exit_code=2 ;;
          esac

          max_features="${MAX_FEATURES_INPUT:-50}"
          case "$max_features" in
            ''|*[!0-9]*|0) echo "::error::Invalid max_features input."; exit_code=2 ;;
            *) ;;
          esac

          echo "platform=${PLATFORM_INPUT:-}" >> "$GITHUB_OUTPUT"
          echo "stale_only=${STALE_ONLY_INPUT:-false}" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "max_features=$max_features" >> "$GITHUB_OUTPUT"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ]; then
            exit "$exit_code"
          fi

      - name: Run feature verification
        id: verify
        if: steps.args.outcome == 'success'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM_INPUT: ${{ steps.args.outputs.platform }}
          STALE_ONLY_INPUT: ${{ steps.args.outputs.stale_only }}
          DRY_RUN_INPUT: ${{ steps.args.outputs.dry_run }}
          MAX_FEATURES_INPUT: ${{ steps.args.outputs.max_features }}
        run: |
          set +e
          args=(--verbose)
          if [ -n "${PLATFORM_INPUT:-}" ]; then
            args+=(--platform "$PLATFORM_INPUT")
          fi
          if [ "${STALE_ONLY_INPUT:-false}" = "true" ]; then
            args+=(--stale-only)
          fi
          if [ "${DRY_RUN_INPUT:-false}" = "true" ]; then
            args+=(--dry-run)
          fi
          args+=(--max "${MAX_FEATURES_INPUT:-50}")
          node scripts/verify-features.js "${args[@]}"
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      # Exit code 1 means that evidence was delivered for human review. It is a
      # successful execution state, but never permits source changes or a push.
      - name: Sync derived evidence
        id: sync_evidence
        if: steps.verify.outputs.exit_code == '0' && steps.args.outputs.dry_run == 'false'
        run: node scripts/sync-evidence.js

      - name: Validate ontology
        id: validate_ontology
        if: steps.verify.outputs.exit_code == '0' && steps.args.outputs.dry_run == 'false'
        run: node scripts/validate-ontology.js

      - name: Generate published data
        id: build
        if: steps.verify.outputs.exit_code == '0' && steps.args.outputs.dry_run == 'false'
        run: node scripts/build.js

      - name: Validate structured data
        id: validate_structured_data
        if: steps.verify.outputs.exit_code == '0' && steps.args.outputs.dry_run == 'false'
        run: node scripts/validate-structured-data.js

      - name: Commit Checked-date updates
        id: commit
        if: steps.verify.outputs.exit_code == '0' && steps.args.outputs.dry_run == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/platforms/ data/watchlist/ data/evidence/index.json docs/
          if git diff --staged --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update adequately checked feature dates"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push Checked-date updates
        id: push
        if: steps.commit.outputs.committed == 'true'
        run: |
          set -euo pipefail
          git pull --rebase
          git push

      - name: Publish verification summary
        if: always()
        run: |
          set +e
          {
            echo "## Verification run"
            if [ -f .verification-reports/summary.txt ]; then
              cat .verification-reports/summary.txt
            else
              echo "status: failed"
              echo "reason: verification evidence envelope is missing"
            fi
            echo
            echo "Review candidates remain pending for human acceptance."
            echo "Direct notification: not_configured. Human receipt: unconfirmed."
            echo "Missing-run monitor: not_configured; T02b email selection has no authorized sends."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Finalize workflow evidence
        id: finalize
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          CLI_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
          CLI_OUTCOME: ${{ steps.verify.outcome }}
          INITIALIZE_OUTCOME: ${{ steps.initialize.outcome }}
          ARGS_OUTCOME: ${{ steps.args.outcome }}
          SYNC_EVIDENCE_OUTCOME: ${{ steps.sync_evidence.outcome }}
          VALIDATE_ONTOLOGY_OUTCOME: ${{ steps.validate_ontology.outcome }}
          VALIDATE_STRUCTURED_DATA_OUTCOME: ${{ steps.validate_structured_data.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/finalize-verification-workflow.js

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: .verification-reports/
          retention-days: 30

      # Artifact delivery comes first. This final gate makes operational exit 2,
      # missing evidence, build failure, commit failure, and push failure fail
      # the job while allowing exit 1's delivered review queue to stay green.
      - name: Enforce terminal verification status
        if: always()
        run: node scripts/finalize-verification-workflow.js --check

  # The existing scheduled staleness lane intentionally remains independent of
  # the verification health contract and does not infer health from issue count.
  staleness-check:
    name: Check for Stale Features
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check staleness
        id: staleness
        run: |
          node -e '
            const { findStaleFeatures } = require("./scripts/lib/parser");
            const stale = findStaleFeatures(30);
            console.log("Found " + stale.length + " stale features");
            fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "count=" + stale.length + "\n");
          '
      - name: Create staleness issue
        if: steps.staleness.outputs.count > 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="[Automated] ${{ steps.staleness.outputs.count }} features need verification"
          existing=$(gh issue list --state open --label verification-needed --json number --jq 'sort_by(.number) | .[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Existing staleness issue #$existing remains open"
            exit 0
          fi
          gh label create verification-needed --color 0e8a16 --description "Feature needs verification" 2>/dev/null || true
          gh issue create --title "$title" --label verification-needed --body "The staleness lane found features needing verification. Run Verify Features for retained evidence and human review."
