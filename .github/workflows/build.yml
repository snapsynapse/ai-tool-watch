name: Build and Deploy

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 1 * * 1,4'  # 6pm Pacific (Mon & Thu)

jobs:
  # Gates build and deploy on ontology integrity.
  #
  # Deliberately does NOT run sync-evidence first. The point is to validate
  # the committed state; regenerating the evidence index before checking it
  # would make the drift check self-fulfilling and mask exactly the class of
  # error it exists to catch.
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate ontology
        run: node scripts/validate-ontology.js

      - name: Test publication and freshness contracts
        run: node scripts/test-offline.js

      # The scheduled trial passed all 88 claims on 2026-09-07.
      - name: Validate talking-point claims
        run: node scripts/validate-claims.js

  prepare-publication:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare reviewed publication artifact
        run: node scripts/prepare-publication.js

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain -- data/platforms/ data/watchlist/ data/evidence/index.json docs/) ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated dashboard
        if: (github.event_name == 'push' || github.event_name == 'schedule') && steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/platforms/ data/watchlist/ data/evidence/index.json docs/
          git commit -m "Rebuild dashboard [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload reviewed publication artifact
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-publication
          path: docs/
          include-hidden-files: true
          if-no-files-found: error

      - name: Record source and artifact receipt
        run: |
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "source_tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
          node -e "const m=require('./docs/publication-manifest.json'); console.log('reviewed_input_sha256=' + m.reviewed_input_sha256); console.log('artifact_sha256=' + m.artifact_sha256)" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: prepare-publication
    if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout verifier
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download reviewed publication artifact
        uses: actions/download-artifact@v4
        with:
          name: reviewed-publication
          path: publication

      - name: Verify downloaded publication artifact
        run: node scripts/verify-publication-manifest.js publication

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publication

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-ftp:
    needs: prepare-publication
    if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-ftp.yml
    with:
      artifact-name: reviewed-publication
    secrets: inherit
